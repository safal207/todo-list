  <style>
    :root { color-scheme: light; font-family: system-ui,-apple-system,Arial,sans-serif; color:#2c1922; background:#fff7e7; }
    * { box-sizing:border-box; }
    body { margin:0; padding:1.2rem; }
    main { max-width:38rem; margin:0 auto; }
    .brand { display:flex; align-items:center; gap:.5rem; font-size:1.45rem; font-weight:900; margin-bottom:1rem; }
    .mark { display:grid; place-items:center; width:2.6rem; height:2.6rem; border-radius:.65rem; color:white; background:#e4402b; font-size:1.8rem; }
    article { padding:1rem; border:2px solid #2c1922; border-radius:1rem; background:#fffdf7; box-shadow:0 .35rem 0 #2c1922; }
    /* Never crop or magnify the share poster in Telegram's in-app browser. */
    .poster-frame { display:flex; justify-content:center; width:100%; min-width:0; overflow:hidden; border-radius:.65rem; background:#fff2d9; }
    .poster-frame img {
      display:block;
      width:100%;
      max-width:100%;
      height:auto;
      max-height:min(35vh, 300px);
      aspect-ratio:auto;
      object-fit:contain;
      object-position:center;
    }
    h1 { margin:.9rem 0 .55rem; font-size:clamp(1.65rem,6vw,2.35rem); line-height:1.12; letter-spacing:-.035em; }
    .stat { margin:.55rem 0; font-size:1.05rem; font-weight:750; }
    .cta { display:block; margin:1.1rem 0 .5rem; padding:1rem; border:2px solid #2c1922; border-radius:.75rem; background:#ffcb48; color:#2c1922; text-align:center; font-size:1.1rem; font-weight:900; text-decoration:none; box-shadow:0 .2rem 0 #2c1922; }
    .cta:hover { background:#ffdd80; }
    .privacy { font-size:.78rem; color:#675455; line-height:1.4; }
    a:focus-visible { outline:3px solid #246bbd; outline-offset:4px; }
    @media(max-width:400px) { body { padding:.65rem; } article { padding:.75rem; } }
  </style>
</head>
<body>
<main>
  <header class="brand"><span class="mark" aria-hidden="true">✓</span> Сделано.</header>
  <article>
    <div class="poster-frame">
      <img src="../assets/share-step-1-v2.jpg" alt="ШАГ 1 — ЗАПИШИ ЗАДАЧУ. Жми и делай!" width="1200" height="630" fetchpriority="high">
    </div>
    <h1>Твой ход. Запиши одну задачу!</h1>
    <p id="friend-score" class="stat">Друг поделился результатом в «Сделано».</p>
    <a id="start-own" class="cta" href="../?utm_source=progress_share&amp;utm_medium=referral&amp;utm_campaign=telegram_invite_v1">Начать задачу</a>
    <p class="privacy">Твой список будет только у тебя.</p>
  </article>
</main>
<script src="../analytics.js"></script>
<script>
  "use strict";
  const analytics = window.sdelanoAnalytics;
  analytics?.track("invite_viewed");
  analytics?.openReferral();
  document.querySelector("#start-own").addEventListener("click", () => analytics?.startReferral());
  const params = new URLSearchParams(location.search);
  const number = (value) => /^\d{1,4}$/.test(value ?? "") ? Number(value) : NaN;
  const done = number(params.get("done"));
  const total = number(params.get("total"));
  if (Number.isInteger(total) && total > 0 && total <= 9999 &&
      Number.isInteger(done) && done >= 0 && done <= total) {
    const percent = Math.floor(done / total * 100);
    document.querySelector("#friend-score").textContent =
      "У друга готово " + done + " из " + total + " задач (" + percent + "%).";
  }
</script>
</body>
