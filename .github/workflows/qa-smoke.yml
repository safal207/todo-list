name: QA smoke — tasks UI

on:
  pull_request:
    paths:
      - "index.html"
      - "assets/**"
      - "styles.css"
      - "app.js"
      - "backup.js"
      - "cloud-config.js"
      - "cloud-sync.js"
      - "cloud-merge.js"
      - "supabase/**"
      - "analytics.js"
      - "pilot.js"
      - "pilot-results.js"
      - "pilot/**"
      - "share-poster.js"
      - "clock.js"
      - "effects.js"
      - "game-preview.js"
      - "game.js"
      - "focus.js"
      - "shop.js"
      - "game-preview.css"
      - "game-juice.js"
      - "game-juice.css"
      - "brand-flavor.css"
      - "fox-evolution.js"
      - "fox-evolution.css"
      - "fox-evolution-art-v2.js"
      - "fox-evolution-art-v2.css"
      - "fox-phone-preview.html"
      - "fox-phone-preview.js"
      - "fox-phone-feedback.js"
      - "fox-ceremony.css"
      - "fox-ceremony.js"
      - "invite/index.html"
      - "tests/*.mjs"
      - ".github/workflows/qa-smoke.yml"
  push:
    branches:
      - ux/focus-on-tasks
    paths:
      - "index.html"
      - "assets/**"
      - "styles.css"
      - "app.js"
      - "backup.js"
      - "cloud-config.js"
      - "cloud-sync.js"
      - "cloud-merge.js"
      - "supabase/**"
      - "analytics.js"
      - "pilot.js"
      - "pilot-results.js"
      - "pilot/**"
      - "share-poster.js"
      - "clock.js"
      - "effects.js"
      - "game-preview.js"
      - "game-preview.css"
      - "game-juice.js"
      - "game-juice.css"
      - "brand-flavor.css"
      - "fox-evolution.js"
      - "fox-evolution.css"
      - "fox-evolution-art-v2.js"
      - "fox-evolution-art-v2.css"
      - "fox-phone-preview.html"
      - "fox-phone-preview.js"
      - "fox-phone-feedback.js"
      - "fox-ceremony.css"
      - "fox-ceremony.js"
      - "game.js"
      - "focus.js"
      - "shop.js"
      - "invite/index.html"
      - "tests/*.mjs"
      - ".github/workflows/qa-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      SDELANO_QA_ENGINE: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright browser
        run: |
          npm install --no-save --no-package-lock playwright@1.62.1
          npx playwright install --with-deps "$SDELANO_QA_ENGINE"
      - name: Verify external mobile demo entrypoint
        if: matrix.browser == 'chromium'
        env:
          PREVIEW_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          url="https://raw.githack.com/safal207/todo-list/$PREVIEW_SHA/fox-phone-preview.html"
          curl -fL --retry 2 --max-time 30 --output /tmp/sdelano-fox-phone-preview.html "$url"
          grep -q 'Fox Evolution v3' /tmp/sdelano-fox-phone-preview.html
          grep -q 'phone-qa-complete' /tmp/sdelano-fox-phone-preview.html
          grep -q 'phone-qa-review' /tmp/sdelano-fox-phone-preview.html
          printf 'Mobile preview fetched: %s bytes\\n' "$(wc -c </tmp/sdelano-fox-phone-preview.html)"
      - name: Serve and test mobile + desktop
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/tasks-qa-server.log 2>&1 &
          node tests/qa-smoke.mjs
          node tests/game-preview.mjs
          node tests/game-juice.mjs
          node tests/fox-evolution.mjs
          node tests/fox-evolution-art-v2.mjs
          node tests/fox-ceremony.mjs
          node tests/fox-phone-preview.mjs
          node tests/fox-phone-feedback.mjs
          node tests/fox-smooth-v31.mjs
          node tests/brand-flavor.mjs
          node tests/game-economy.mjs
          node tests/game-focus.mjs
          node tests/game-shop.mjs
          node tests/game-wallet-sync.mjs
          node tests/first-visit.mjs
          node tests/pilot-results.mjs
          node tests/pilot-delight.mjs
          node tests/task-edit.mjs
          node tests/backup-restore.mjs
          node tests/cloud-sync.mjs
          node tests/cloud-integration.mjs
      - name: Upload visual snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tasks-ui-screenshots-${{ matrix.browser }}
          path: artifacts/
          if-no-files-found: ignore
