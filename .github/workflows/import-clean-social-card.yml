name: One-time import of clean social card

on:
  push:
    branches:
      - feat/clean-social-card-v2
    paths:
      - ".github/workflows/import-clean-social-card.yml"

permissions:
  contents: write

jobs:
  import-social-image:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Import compact JPEG social preview
        env:
          SOURCE_IMAGE_URL: 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/0048b003-7f1b-4a7c-bb5c-72ec59d27247.jpg?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiNDNlZjUxMDhiNzcwZTE5OCIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5NTM2MDUyMH0.gycrTWzbiP9NaxiO_ul-xlOWnBb3YT7PjdUoVBDMP5E'
        run: |
          set -euo pipefail
          mkdir -p assets
          curl --fail --silent --show-error --location --retry 3 "$SOURCE_IMAGE_URL" -o assets/share-step-1-v2.jpg
          test "$(file -b --mime-type assets/share-step-1-v2.jpg)" = "image/jpeg"
          file assets/share-step-1-v2.jpg | grep -q '1200x630'
          test "$(stat -c%s assets/share-step-1-v2.jpg)" -gt 30000
          test "$(stat -c%s assets/share-step-1-v2.jpg)" -lt 500000
      - name: Commit poster to this branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/share-step-1-v2.jpg
          git commit -m "assets: replace cluttered social card with clean step one image"
          git push origin HEAD:feat/clean-social-card-v2
