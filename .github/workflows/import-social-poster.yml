name: One-time import of marketing image

on:
  push:
    branches:
      - feat/share-poster-og-image
    paths:
      - ".github/workflows/import-social-poster.yml"

permissions:
  contents: write

jobs:
  import-poster:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Download image and validate PNG
        env:
          IMAGE_URL: 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/4faa410e-db36-489b-af85-40c3039f6642.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiODA3MmJjMTUwNGJhZDRlZSIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5NTMxOTcwMX0.gwYcBrWKf5O5oV9RZk1aLP9Z6-lm3v2zMZi8Ie0B984'
        run: |
          set -euo pipefail
          mkdir -p assets
          curl --fail --silent --show-error --location --retry 3 "$IMAGE_URL" -o assets/share-poster.png
          python3 - <<'PY'
          import struct
          from pathlib import Path
          data = Path("assets/share-poster.png").read_bytes()
          assert data[:8] == b"\x89PNG\r\n\x1a\n", "Not a valid PNG"
          width, height = struct.unpack(">II", data[16:24])
          assert (width, height) == (1672, 941), (width, height)
          assert len(data) > 100_000, "Image unexpectedly small"
          print("Image:", width, height, "bytes:", len(data))
          PY
      - name: Commit image to feature branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/share-poster.png
          git commit -m "assets: add generated Сделано marketing poster for social sharing"
          git push origin HEAD:feat/share-poster-og-image
