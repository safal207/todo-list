<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Простой список задач с сохранением в браузере.">
    <meta name="theme-color" content="#f5f3fb">
    <title>Список задач</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="workspace">
      <header class="page-header">
        <span class="page-icon" aria-hidden="true"></span>
        <h1>Список задач</h1>
      </header>

      <div class="board">
        <section class="task-panel" aria-labelledby="tasks-heading">
          <form id="task-form">
            <label for="task-title">Новая задача</label>
            <div class="form-controls">
              <input id="task-title" name="title" type="text" placeholder="Например, отправить отчёт" maxlength="200" autocomplete="off" required>
              <button class="add-button" type="submit"><span aria-hidden="true">+</span> Добавить</button>
            </div>
          </form>

          <div class="task-section">
            <h2 id="tasks-heading">Задачи</h2>
            <ul id="tasks" class="task-list" role="list"></ul>
            <div id="empty-state" class="empty-state">
              <span class="empty-icon" aria-hidden="true"><i></i></span>
              <p><strong>Задач пока нет</strong></p>
              <p>Добавьте первую задачу в форму выше.</p>
            </div>
          </div>
        </section>

        <aside class="progress-panel" aria-labelledby="progress-heading">
          <h2 id="progress-heading">Прогресс</h2>
          <p id="percentage" class="percentage" aria-hidden="true">0%</p>
          <progress id="progress" max="100" value="0" aria-label="Доля выполненных задач"></progress>
          <p id="progress-summary" class="progress-summary" role="status">Выполнено 0 из 0</p>
        </aside>
      </div>

      <footer class="page-footer">
        <p id="storage-note">Задачи сохраняются в этом браузере.</p>
        <p id="storage-warning" class="storage-warning" role="status" hidden>Сохранение недоступно. Изменения могут исчезнуть после обновления страницы.</p>
      </footer>
    </main>

    <template id="task-template">
      <li class="task">
        <label class="task-label">
          <input class="task-checkbox" type="checkbox">
          <span class="task-title"></span>
        </label>
        <button class="delete-button" type="button"><span class="trash-icon" aria-hidden="true"></span></button>
      </li>
    </template>
  </body>
</html>
